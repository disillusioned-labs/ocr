[project]
name = "ocr-engine"
version = "0.1.0"
description = "ocr - the OCR engine service (Kontrak B, document.v1)"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.66",
    "grpcio-health-checking>=1.66",
    "protobuf>=5.26",
    "saq>=0.22",
    "redis>=5.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "confluent-kafka>=2.5",
    "httpx>=0.27",
    "aioboto3>=13.2",
    "pymupdf>=1.24",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "dateparser>=1.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.26",
    "opentelemetry-exporter-otlp-proto-grpc>=1.26",
]

[project.scripts]
ocr-api = "ocr_engine.cli.api:main"
ocr-worker = "ocr_engine.cli.worker:main"
ocr-outbox = "ocr_engine.cli.outbox:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "grpcio-tools>=1.66",
    "respx>=0.21",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs live Postgres/Redis/Kafka (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
exclude = ["src/ocr_engine/proto_gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
exclude = ["proto_gen"]

[[tool.mypy.overrides]]
module = ["ocr_engine.proto_gen.*", "google.protobuf.*", "saq.*", "dateparser.*", "confluent_kafka.*", "aioboto3.*", "aioboto3.resources.*", "fitz.*"]
ignore_missing_imports = true
