# The ocr processes. Postgres/Redis/storage belong to infra/data, Kafka to
# infra/messaging, and the OTel collector to infra/observability - there is
# deliberately no per-service collector here: it would be a second ingest
# path for the same data the central collector already receives.
#
# Base configuration comes from .env; .env.compose only swaps addresses for
# the compose networks (same pattern as every service).
services:
  api:
    container_name: ocr-api
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env
      - .env.compose
    entrypoint: ["ocr-api"]
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD", "python", "/app/scripts/grpc_healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      data:
        # Stable cross-Compose DNS name used by ocr-gateway.
        aliases:
          - ocr-grpc
      messaging: {}
      observability: {}
    restart: unless-stopped

  worker:
    container_name: ocr-worker
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env
      - .env.compose
    entrypoint: ["ocr-worker"]
    networks:
      - data
      - messaging
      - observability
    restart: unless-stopped

  outbox:
    container_name: ocr-outbox
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env
      - .env.compose
    entrypoint: ["ocr-outbox"]
    networks:
      - data
      - messaging
      - observability
    restart: unless-stopped

networks:
  data:
    external: true
    name: data

  messaging:
    external: true
    name: messaging

  observability:
    external: true
    name: observability
